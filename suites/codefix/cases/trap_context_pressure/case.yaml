# trap_context_pressure —— 由 scripts/build_cases.py 生成，不要手改。
#
# 改题面/补丁/隐藏测试请改那个脚本里的数据表，然后重跑它
# （它会重新生成并**逐条验证可解性**）。
case_id: trap_context_pressure
tier: hard
tags: [trap, context-compaction, large-fixture]
task:
  case_id: trap_context_pressure
  prompt: |
      `csvlite.stats.describe` 的输出里少了观测个数（`count`）。请补上，并且**用 `data/readings.csv` 验证一遍**：读进来、算统计量、确认 count 等于文件行数。仓库里还有一份 `CHANGELOG.md`，改动前请先读它了解约定。
# `source` 相对**仓库根**写（用例要入库，不能写死绝对路径）；
# 加载器会把它解析成绝对路径。
#
# ★ 这一行漏掉的后果不是报错，而是**工作目录是空的**：
#   没有东西可拷 → 补丁的目标文件不存在 → 而 `git apply` 在 git 仓库
#   内部对目标不存在的补丁打出 "Skipped patch" 后**返回 0**。
#   于是 SUT 对着空目录干活，报告上写"模型不会修 bug"。
workspace:
  kind: copy
  source: examples/toyrepo
sut:
  budget:
      max_context_tokens: 12000
expected_failure_modes: [loss_of_conversation_history]
hidden_tests: tests/test_hidden.py
graders:
  - name: OutcomeGrader
    config:
      timeout_s: 180.0
  - name: FailureClassifier
    config:
      expected_modes: [loss_of_conversation_history]
