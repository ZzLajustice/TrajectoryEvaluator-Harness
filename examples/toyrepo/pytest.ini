; 本仓库自己的 pytest 配置。
;
; ## 它为什么必须存在（不只是"像个真实项目"）
;
; 缺少它时，在被测工作目录里跑 `pytest` 会向上找到**外层 harness 仓库**的
; `pyproject.toml` 并把它当成自己的配置 —— 实测输出里会看到：
;
;     rootdir: C:\Users\...\评测harness
;     configfile: pyproject.toml
;     plugins: anyio-4.15.1, hypothesis-6.167.1, asyncio-1.4.0, cov-7.1.0, ...
;
; 于是 harness 自己的 `testpaths` / `addopts` / `filterwarnings` 全部生效，
; 还有五个插件被加载。**被测的是这份代码，不是 harness 的测试配置** ——
; 而一旦这些设置开始影响结果，SUT 看到的现象就与它的改动无关了。
;
; 有了这个文件，pytest 会在这里停住：rootdir 就是工作目录自身。

[pytest]
testpaths = tests
